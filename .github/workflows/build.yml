name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      GRADLE_OPTS: -Djava.awt.headless=true -Dorg.gradle.daemon=false

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.5 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Eksik Dosyalari Duzelt
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Sermaye"
          include ':app'
          EOF
          
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          if [ ! -f "app/build.gradle" ]; then
            echo "app/build.gradle YOK, olusturuluyor..."
            mkdir -p app
            cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sermaye.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sermaye.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          else
            echo "app/build.gradle VAR"
          fi
          
          echo "=== DOSYALAR ==="
          ls -R
          echo "=== APP BUILD ==="
          cat app/build.gradle

      - name: APK Derle
        run: gradle assembleDebug --no-daemon --console=plain

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Sermaye-APK
          path: app/build/outputs/apk/debug/app-debug.apk
