name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip and Build
        run: |
          unzip -o sermaye.zip
          ls -la
          # gradlew yoksa gradle indir
          if [ ! -f "gradlew" ]; then
            echo "gradlew yok, gradle indiriyorum..."
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            export PATH=$PWD/gradle-8.7/bin:$PATH
          else
            chmod +x gradlew
          fi
          # build yap
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            $PWD/gradle-8.7/bin/gradle assembleDebug --no-daemon
          fi
          find . -name "app-debug.apk" -exec cp {} $GITHUB_WORKSPACE/ \;
          ls -lh $GITHUB_WORKSPACE/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sermaye-apk
          path: app-debug.apk
