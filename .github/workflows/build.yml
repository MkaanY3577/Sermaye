name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      GRADLE_OPTS: -Djava.awt.headless=true -Dorg.gradle.daemon=false

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.5 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Eksik Dosyalari Olustur
        run: |
          echo "=== ONCE NE VAR ===" || true
          ls -la || true
          echo "=== APP VAR MI? ===" || true
          ls -la app/ || echo "APP KLASORU YOK!" || true
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "settings.gradle YOK, olusturuluyor..."
            echo "include ':app'" > settings.gradle
            echo "rootProject.name = 'Sermaye'" >> settings.gradle
            cat settings.gradle || true
          else
            echo "settings.gradle VAR" || true
            cat settings.gradle || true
          fi
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "ROOT build.gradle YOK, olusturuluyor..."
            echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          fi

      - name: APK Derle
        run: gradle assembleDebug --no-daemon --console=plain

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Sermaye-APK
          path: app/build/outputs/apk/debug/app-debug.apk
