name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip and Build
        run: |
          ls -la
          unzip -o sermaye.zip
          ls -la
          find . -maxdepth 4 -name "gradlew" | head
          DIR=$(find . -maxdepth 4 -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then DIR="."; fi
          echo "Proje klasoru: $DIR"
          cd "$DIR"
          ls -la
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew yok, sistem gradle ile deniyorum"
            sudo apt-get update -qq && sudo apt-get install -y -qq gradle
            gradle assembleDebug --no-daemon
          fi
          find . -name "app-debug.apk" -exec cp {} $GITHUB_WORKSPACE/ \;
          ls -lh $GITHUB_WORKSPACE/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sermaye-apk
          path: app-debug.apk
