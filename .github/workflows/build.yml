name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      GRADLE_OPTS: -Djava.awt.headless=true -Dorg.gradle.daemon=false

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.5 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Dosyalari Goster
        run: |
          ls -la || true
          echo "--- SDK ---"
          echo "ANDROID_HOME=$ANDROID_HOME" || true
          ls "$ANDROID_HOME" || true
          echo "--- app ---"
          ls -la app/ || true

      - name: APK Derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Sermaye-APK
          path: app/build/outputs/apk/debug/app-debug.apk
