name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip and Build
        run: |
          unzip -o sermaye.zip
          echo "=== DOSYALAR ==="
          find . -maxdepth 3 -type d | head -n 50
          echo "=== SETTINGS ARIYORUM ==="
          find . -name "settings.gradle*" | head
          # Gercek proje klasorunu bul
          APP_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$APP_DIR" ]; then APP_DIR="."; fi
          echo "Proje klasoru: $APP_DIR"
          cd "$APP_DIR"
          ls -la
          chmod +x gradlew || true
          ./gradlew assembleDebug
          find . -name "app-debug.apk" -exec cp {} $GITHUB_WORKSPACE/ \;
          ls -lh $GITHUB_WORKSPACE/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sermaye-apk
          path: app-debug.apk
