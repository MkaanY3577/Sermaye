name: Build APK
on: [push, workflow_dispatch]
jobs:env:
  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
  GRADLE_OPTS: -Djava.awt.headless=true -Dorg.gradle.daemon=false
  build:./gradlew assembleDebug --no-daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip and Build
        run: |
          unzip -o sermaye.zip
          ls -la
          if [ ! -f "gradlew" ]; then
            echo "gradle 9.3.1 indiriyorum..."
            wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
            unzip -q gradle-9.3.1-bin.zip
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            $PWD/gradle-9.3.1/bin/gradle assembleDebug --no-daemon
          fi
          find . -name "app-debug.apk" -exec cp {} $GITHUB_WORKSPACE/ \;
          ls -lh $GITHUB_WORKSPACE/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sermaye-apk
          path: app-debug.apk
