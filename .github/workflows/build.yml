name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip and Build
        run: |
          unzip -o sermaye.zip
          DIR=$(find . -maxdepth 3 -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "Proje klasoru: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
          find . -name "app-debug.apk" -exec cp {} $GITHUB_WORKSPACE/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: sermaye-apk
          path: app-debug.apk
